<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumera Learning Hub · MDOE407 formative practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>:root{--ink:#070d18;--panel:#14243b;--panel2:#1b3050;--teal:#2A7F8E;--teal2:#5fc3d3;--gold:#f2c14e;--ok:#5fd38a;--bad:#ff7a70;--txt:#e8eef7;--mut:#9fb0c7;--line:#2d4668}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 50% 30%,#10213a,#070d18);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.px{font-family:"Press Start 2P","Courier New",monospace;letter-spacing:.5px}
#hud{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#0b1626;border-bottom:3px solid #1d3a5c;flex-wrap:wrap}
#hud h1{font-size:11px;margin:0;color:var(--gold);line-height:1.5;font-weight:400}
#hud .sub{color:var(--mut);font-size:12px}
#hud .grow{flex:1}
#prog{font-size:13px;color:var(--txt);background:#10213a;border:2px solid var(--line);padding:3px 10px;border-radius:3px}
.btn{font:700 13px system-ui,sans-serif;color:#fff;background:var(--teal);border:0;border-bottom:4px solid #1b5560;border-radius:4px;padding:8px 14px;cursor:pointer}
.btn:hover{background:#34909f}.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.ghost{background:#1d3250;border-bottom-color:#12233a}.btn.ghost:hover{background:#27426a}
.btn.gold{background:#c9972c;border-bottom-color:#8a6619;color:#1a1204}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-within{outline:3px solid var(--gold);outline-offset:2px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;position:relative}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid #0a1424;box-shadow:0 0 0 3px #3a6a8c,0 18px 50px rgba(0,0,0,.6);background:#000;max-width:100%;max-height:100%}
#pad{display:none;position:absolute;left:14px;bottom:14px;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;user-select:none;touch-action:none}
#pad button{background:rgba(20,36,59,.8);border:2px solid var(--teal2);border-radius:8px;color:#fff;font-size:20px}
#act{display:none;position:absolute;right:18px;bottom:24px;width:78px;height:78px;border-radius:50%;background:rgba(201,151,44,.9);border:3px solid #fff;font:700 22px system-ui;color:#1a1204}
@media (pointer:coarse){#pad{display:grid}#act{display:block}}
.overlay{position:fixed;inset:0;background:rgba(4,9,18,.74);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.panel{width:min(940px,100%);max-height:94vh;overflow:auto;background:var(--panel);border:3px solid var(--teal2);box-shadow:0 0 0 3px #04101e,10px 10px 0 rgba(0,0,0,.45);border-radius:4px;padding:20px 22px}
.panel h2{margin:0 0 4px;font-size:21px}
.panel h3{margin:16px 0 6px;font-size:15px;color:var(--teal2)}
.panel p{margin:6px 0}
.mut{color:var(--mut)}.small{font-size:13px}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#1f3a5f;border:1px solid var(--line);color:#cfe3ff}
.note{background:#10213a;border-left:4px solid var(--gold);padding:8px 12px;border-radius:3px;margin:10px 0}
.opts{display:grid;gap:8px;margin:6px 0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:#10213a;border:2px solid var(--line);border-radius:5px;cursor:pointer}
.opt:hover{border-color:var(--teal2)}
.opt input{margin-top:4px;accent-color:#5fc3d3}
.opt.sel{border-color:var(--teal2);background:#163253}
.opt.good{border-color:var(--ok);background:#12311f}.opt.badc{border-color:var(--bad);background:#3a1818}
.fb{margin-top:12px;padding:12px 14px;border-radius:5px;border:2px solid var(--line);background:#10213a}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}.fb.hint{border-color:var(--gold)}
.fb b.t{display:block;margin-bottom:2px}
table.d{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
table.d th,table.d td{border:1px solid var(--line);padding:4px 8px;text-align:center}
table.d th{background:#1b3050;color:#cfe3ff;font-weight:600}
table.d td:first-child,table.d th:first-child{text-align:left}
table.d tr.hl td{background:#1c3a2c}
.bar{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pcv{image-rendering:pixelated;background:linear-gradient(#27405f,#14243b);border:3px solid var(--line);border-radius:6px}
.list{display:grid;gap:8px}
.list button{text-align:left}
.stm{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;background:#10213a;border:2px solid var(--line);border-radius:5px;margin-bottom:8px}
.stm .src{font-size:12px;color:var(--mut)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:600 12px system-ui;color:#cfe3ff;background:#1b3050;border:2px solid var(--line);border-radius:4px;padding:6px 9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--teal);border-color:var(--teal2);color:#fff}
.stm.good{border-color:var(--ok)}.stm.badc{border-color:var(--bad)}
.stm .why{grid-column:1/-1;font-size:13px;color:#cfe3ff}
textarea,input[type=text]{width:100%;background:#0b1626;color:var(--txt);border:2px solid var(--line);border-radius:5px;padding:9px 11px;font:inherit}
.ck{margin:4px 0;font-size:14px}.ck.y{color:var(--ok)}.ck.n{color:var(--bad)}
@media (max-width:640px){.panel{padding:14px}#hud h1{font-size:9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- hub additions ---- */
#menu{position:fixed;inset:0;z-index:15;overflow:auto;background:radial-gradient(1100px 700px at 50% 0%,#12294a,#070d18)}
#menu .wrap{max-width:1080px;margin:0 auto;padding:18px 18px 40px}
#menu canvas{width:100%;height:auto;image-rendering:pixelated;display:block;border:4px solid #0a1424;box-shadow:0 0 0 3px #3a6a8c;border-radius:2px}
#menu h1{font-size:clamp(14px,2.4vw,22px);line-height:1.6;color:var(--gold);margin:22px 0 6px;font-weight:400}
#menu .lead{color:#cfe3ff;max-width:780px;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{position:relative;text-align:left;background:var(--panel);border:3px solid var(--line);border-radius:5px;padding:14px 16px 14px 62px;color:var(--txt);cursor:pointer;font:inherit;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
.card:hover{border-color:var(--teal2);transform:translate(-1px,-1px)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.card .n{position:absolute;left:12px;top:12px;width:38px;height:38px;display:grid;place-items:center;background:#0b1626;border:3px solid var(--teal2);color:var(--gold);font:11px "Press Start 2P","Courier New",monospace}
.card.done .n{border-color:var(--ok);color:var(--ok)}
.card b{display:block;font-size:16px;margin-bottom:2px}
.card .meta{font-size:12.5px;color:var(--mut);margin-top:6px}
.card .st{position:absolute;right:12px;top:10px;font-size:12px;font-weight:700;color:var(--mut)}
.card.done .st{color:var(--ok)}.card.rec{border-color:var(--gold)}.card.rec .st{color:var(--gold)}
.card.final{border-style:dashed;background:#101e33}
.sect{font-size:11px;color:var(--teal2);letter-spacing:1.2px;margin:22px 0 10px;text-transform:uppercase}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:min(1040px,calc(100% - 20px));background:rgba(11,22,38,.96);border:3px solid var(--teal2);border-radius:6px;padding:12px 14px;max-height:54%;overflow:auto;z-index:5;box-shadow:0 0 0 3px #04101e,6px 6px 0 rgba(0,0,0,.4)}
#dock[hidden]{display:none}
.say{display:flex;gap:14px;align-items:flex-start}
.say .bub{flex:1;background:#14243b;border:2px solid var(--line);border-radius:8px;padding:10px 14px;font-size:16px}
.say .who{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.4px;display:block;margin-bottom:2px}
.meter{height:12px;background:#0b1626;border:2px solid var(--line);border-radius:3px;overflow:hidden;min-width:130px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#c9972c,#5fd38a);transition:width .4s}
.ch{display:grid;gap:8px;margin-top:10px}
.ch button{display:flex;gap:10px;text-align:left;background:#10213a;border:2px solid var(--line);border-radius:5px;padding:9px 12px;color:var(--txt);font:inherit;cursor:pointer}
.ch button:hover{border-color:var(--teal2)}.ch button:focus-visible{outline:3px solid var(--gold)}
.ch button .k{flex:none;width:22px;height:22px;display:grid;place-items:center;background:#0b1626;border:2px solid var(--teal2);border-radius:3px;font:700 12px system-ui;color:var(--gold)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;margin-right:6px}
.pill.best{background:#12311f;color:var(--ok);border:1px solid var(--ok)}.pill.ok{background:#3a3115;color:var(--gold);border:1px solid var(--gold)}.pill.poor{background:#3a1818;color:var(--bad);border:1px solid var(--bad)}
.guide4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.guide4 div{background:#10213a;border:2px solid var(--line);border-radius:5px;padding:10px 12px}.guide4 b{color:var(--gold)}
body.scene #pad,body.scene #act{display:none!important}

@media (max-width:640px){.say{flex-wrap:wrap}.say .bub{flex:1 1 55%}.say>div:last-child{flex:1 1 100%}}
.pbar{height:6px;background:#0b1626;border:1px solid var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--teal2)}.card.done .pbar i{background:var(--ok)}
.ptxt{font-size:12px;color:var(--mut);margin-top:3px}.pbar.big{height:10px;max-width:420px}.overall{margin:14px 0 4px}
.codebox{background:var(--panel);border:2px solid var(--line);border-radius:5px;padding:10px 14px;margin:14px 0;max-width:760px}.codebox .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.codebox input{background:#0b1626;border:2px solid var(--line);border-radius:4px;color:var(--txt);padding:7px 9px;font:inherit;width:170px}.codebox input:focus-visible{outline:3px solid var(--gold)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .cl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.cmp>div{display:flex;flex-direction:column;min-width:0}
.cmp .box{background:#0f1d33;border:2px solid var(--line);border-radius:6px;padding:9px 11px;font-size:14px;line-height:1.5;flex:1}
.cmp .box.mdl{background:#15283f;border-color:var(--teal2)}
.opts.sc .opt{font-size:14px}

<script>
'use strict';
const TILE=32,COLS=30,ROWS=17,W=COLS*TILE,H=ROWS*TILE;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return [c,g]}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexRGB(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function shade(hex,a){let [r,g,b]=hexRGB(hex);const f=a<0?0:255,t=Math.abs(a);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function disc(g,cx,cy,r,c){g.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));g.fillRect(cx-w,cy+y,w*2+1,1)}}
function ell(g,cx,cy,rx,ry,c){g.fillStyle=c;for(let y=-ry;y<=ry;y++){const w=Math.floor(rx*Math.sqrt(1-(y*y)/(ry*ry)));g.fillRect(cx-w,cy+y,2*w+1,1)}}
function outline(c,col){const g=c.getContext('2d'),w=c.width,h=c.height;const src=g.getImageData(0,0,w,h),d=src.data,o=new Uint8ClampedArray(d);const [r,gg,b]=hexRGB(col);
  const A=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&d[(y*w+x)*4+3]>128;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(d[i+3]<128&&(A(x-1,y)||A(x+1,y)||A(x,y-1)||A(x,y+1))){o[i]=r;o[i+1]=gg;o[i+2]=b;o[i+3]=255}}
  g.putImageData(new ImageData(o,w,h),0,0)}

/* ---------- characters: 16x24 cell design, 2px cells -> 32x48 sprites ---------- */
function drawChar(o,dir,step){
  const [c,g]=mk(32,48);const P=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x*2,y*2,w*2,h*2)};
  const skin=o.skin,skinD=shade(skin,-.16),hair=o.hair,hairD=shade(hair,-.28),hairL=shade(hair,.2);
  const shirt=o.shirt,shirtD=shade(shirt,-.22),shirtL=shade(shirt,.14),pants=o.pants,pantsD=shade(pants,-.28),shoe=o.shoe||'#2a2230';
  const side=dir==='left'||dir==='right';
  const ll=step===1?6:step===2?4:5,rl=step===2?6:step===1?4:5;
  if(side){const a=step===1?-1:step===2?1:0;P(6+a,16,3,5,pants);P(6+a,21,4,1,shoe);P(8-a,16,3,5,pantsD);P(8-a,21,4,1,shoe)}
  else{P(5,16,3,ll,pants);P(5,16,1,ll,pantsD);P(8,16,3,rl,pants);P(10,16,1,rl,pantsD);P(5,16+ll,3,1,shoe);P(8,16+rl,3,1,shoe)}
  g.save();g.translate(0,(step?-1:0));
  if(!side){
    P(4,10,8,6,shirt);P(4,15,8,1,shirtD);P(5,10,2,1,shirtL);
    P(3,10,1,5,shirtD);P(12,10,1,5,shirtD);P(3,15,1,1,skin);P(12,15,1,1,skin);
    if(o.blazer&&dir==='down'){P(7,10,2,5,'#f2f4f8');P(6,10,1,5,shirtL);P(9,10,1,5,shirtL);if(o.tie)P(7,11,2,3,o.tie)}
    else if(o.tie&&dir==='down'){P(7,10,2,4,o.tie)}
    P(7,9,2,1,skinD);
    if(dir==='down'){
      P(4,2,8,7,skin);P(4,8,8,1,skinD);P(3,5,1,2,skin);P(12,5,1,2,skin);
      hairStyle(P,o.style,hair,hairD,hairL,'down');
      P(5,5,1,2,'#17151f');P(10,5,1,2,'#17151f');P(5,4,2,1,hairD);P(9,4,2,1,hairD);P(7,7,2,1,'#a8564c');P(5,7,1,1,shade(skin,.12));P(10,7,1,1,shade(skin,.12));
      if(o.glasses){const f='#2c2c36';P(4,4,4,1,f);P(4,7,4,1,f);P(4,4,1,4,f);P(7,4,1,4,f);P(8,4,4,1,f);P(8,7,4,1,f);P(8,4,1,4,f);P(11,4,1,4,f);P(5,5,1,2,'#17151f');P(10,5,1,2,'#17151f')}
    }else{
      P(4,2,8,7,hair);P(4,8,8,1,hairD);P(5,3,3,1,hairL);
      if(o.style==='long')P(3,3,10,9,hair),P(3,11,10,1,hairD);
      else if(o.style==='bun'){P(6,0,4,2,hair)}
      else if(o.style==='curly'){P(2,2,1,5,hair);P(13,2,1,5,hair);P(3,1,10,2,hair)}
      P(7,9,2,1,skinD);
    }
  }else{
    const a=step===1?-1:step===2?1:0;
    P(5,10,6,6,shirt);P(5,15,6,1,shirtD);P(6+a,10,3,5,shirtD);P(6+a,15,3,1,skin);
    P(7,9,2,1,skinD);
    P(4,2,7,7,skin);P(4,8,7,1,skinD);P(8,5,1,2,skinD);
    P(3,6,1,1,skin);P(5,5,1,2,'#17151f');P(5,4,2,1,hairD);P(5,7,2,1,'#a8564c');
    hairStyle(P,o.style,hair,hairD,hairL,'side');
    if(o.glasses){P(4,5,3,1,'#2c2c36');P(4,4,3,1,'#2c2c36');P(7,5,3,1,'#2c2c36');P(4,7,3,1,'#2c2c36');P(4,4,1,4,'#2c2c36')}
  }
  g.restore();outline(c,'#161224');return c}
function hairStyle(P,st,h,hd,hl,view){
  if(view==='down'){
    if(st==='buzz'){P(4,2,8,1,h)}
    else{P(4,1,8,2,h);P(3,2,1,3,h);P(12,2,1,3,h);P(4,3,8,1,h);P(5,1,3,1,hl);
      if(st==='long'){P(3,3,2,8,h);P(11,3,2,8,h);P(3,10,2,1,hd);P(11,10,2,1,hd)}
      if(st==='bun'){P(6,0,4,2,h);P(7,0,2,1,hl)}
      if(st==='curly'){P(3,1,10,2,h);P(2,2,1,4,h);P(13,2,1,4,h);P(4,3,2,1,h);P(10,3,2,1,h);P(3,0,3,1,h);P(9,0,4,1,h)}
      if(st==='side'){P(4,3,5,2,h)}}
  }else{
    P(4,1,8,2,h);P(5,1,3,1,hl);P(4,3,3,1,h);P(8,3,4,5,h);P(8,7,4,1,hd);
    if(st==='long'){P(8,3,4,9,h);P(8,11,4,1,hd)}
    if(st==='bun'){P(9,0,3,2,h)}
    if(st==='curly'){P(7,0,5,1,h);P(8,3,5,5,h);P(3,3,1,2,h)}
  }
}
function charSet(o){const S={down:[],up:[],left:[],right:[]};
  for(const d of ['down','up','left'])for(let s=0;s<3;s++)S[d][s]=drawChar(o,d,s);
  for(let s=0;s<3;s++){const [c,g]=mk(32,48);g.translate(32,0);g.scale(-1,1);g.drawImage(S.left[s],0,0);S.right[s]=c}
  return S}
const LOOKS={
  you:{skin:'#e3b48f',hair:'#2b2118',style:'side',shirt:'#233d63',pants:'#1e2433',blazer:true,tie:'#c9972c',glasses:false},
  mira:{skin:'#7a5240',hair:'#1c1412',style:'bun',shirt:'#b4436c',pants:'#2f3345'},
  kit:{skin:'#e8c19e',hair:'#c9812f',style:'short',shirt:'#3c8d83',pants:'#3a3f55',glasses:true},
  dana:{skin:'#c68b64',hair:'#3a2a24',style:'long',shirt:'#6b5ca8',pants:'#2f3345'},

    g.fillStyle='rgba(11,22,38,.88)';g.fillRect(bx,y-8,w,16);g.fillStyle='#5fc3d3';g.fillRect(bx,y+6,w,2);

    else if(mark==='ok'){g.strokeStyle='#5fd38a';g.lineWidth=2;g.beginPath();g.moveTo(bx+w-17,y);g.lineTo(bx+w-13,y+4);g.lineTo(bx+w-6,y-4);g.stroke()}
    else if(mark==='retry'){g.fillStyle='#ff9a70';g.fillRect(bx+w-14,y-5,3,7);g.fillRect(bx+w-14,y+3,3,2)}}

  function hud(){Hub.setProg('Stations done: '+doneN()+' / '+N);if(doneN()===N)Hub.complete('a5')}
  function mark(id){ST[id]=true;hud()}
  function overlay2(g,t){const m={wb:[338,60],cal:[616,60],f1:[384,326],f2:[480,326],f3:[576,326]};for(const id in m){if(ST[id])continue;const [x,y]=m[id];const b=Math.sin(t*5+x)*2;g.fillStyle='#0b1626';g.fillRect(x-7,y-8+b,14,17);g.fillStyle='#f2c14e';g.fillRect(x-7,y-8+b,14,2);g.font='bold 12px monospace';g.textAlign='center';g.textBaseline='middle';g.fillText('!',x,y+1+b);g.textAlign='left'}
    for(const [x,y,l] of [[384,362,'1'],[480,362,'2'],[576,362,'3']]){g.font='bold 10px monospace';g.fillStyle='rgba(11,22,38,.85)';g.fillRect(x-30,y-7,60,14);g.fillStyle='#7fe0ee';g.textAlign='center';g.textBaseline='middle';g.fillText('CASE '+l,x,y);g.textAlign='left'}}
  cfg.overlay=overlay2;
  /* ---- generic single-choice question panel ---- */
  function quiz(id,chip,title,intro,qs,doneMsg){let i=0;const first=ST[id];const p=UI.open('<div id="c"></div>',{onClose:hud});
    const draw=()=>{const q=qs[i];$('#c',p).innerHTML=`<span class="chip">${chip} · ${i+1} of ${qs.length}</span><h2>${title}</h2>${i===0&&intro?`<div class="note small">${intro}</div>`:''}<h3>${esc(q.q)}</h3><div class="opts">${q.o.map((o,k)=>`<label class="opt"><input type="${q.multi?'checkbox':'radio'}" name="a" value="${k}"><span>${esc(o.t)}</span></label>`).join('')}</div><div id="fb" aria-live="polite"></div><div class="bar"><button class="btn ghost" id="x">Back to the room</button><button class="btn gold" id="go" autofocus>Check</button></div>`;
      $('#x',p).onclick=()=>UI.close();p.querySelectorAll('input').forEach(r=>r.onchange=()=>p.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked)));
      let tries=0;$('#go',p).onclick=()=>{const sel=[...p.querySelectorAll('input:checked')].map(x=>+x.value);if(!sel.length){$('#fb',p).innerHTML='<div class="fb hint">Choose an answer.</div>';return}
        const good=q.o.map((o,k)=>o.g?k:-1).filter(k=>k>=0),ok=sel.length===good.length&&sel.every(k=>good.includes(k));
        if(ok){const b=$('#go',p);$('#fb',p).innerHTML=`<div class="fb ok"><b class="t">${esc(q.okT||'Yes')}</b>${esc(q.why)}</div>`;p.querySelectorAll('input').forEach(x=>x.disabled=true);
          if(i<qs.length-1){b.textContent='Next';b.onclick=()=>{i++;draw()}}else{mark(id);b.textContent='Finish';b.onclick=()=>{UI.close();setTimeout(()=>done(id,doneMsg),40)}}}
        else{tries++;const fbs=sel.map(k=>q.o[k].f).filter(Boolean);$('#fb',p).innerHTML=`<div class="fb hint"><b class="t">Not quite. Try again.</b>${fbs.map(f=>esc(f)).join('<br>')}${tries>=2?`<br><br><b>A fitting answer:</b> ${esc(good.map(k=>q.o[k].t).join(' / '))}. ${esc(q.why)}`:''}</div>`}}};
    draw()}
  function done(id,msg){const left=N-doneN();const p=UI.open(`<h2>${left?'Nicely done':'All five stations complete'}</h2><p>${esc(msg)}</p>${left?`<p class="mut small">${left} station${left>1?'s':''} still to visit (look for the yellow “!”).</p><div class="bar"><button class="btn gold" id="x" autofocus>Back to the room</button></div>`:`<div class="note small"><b>LO6–LO7:</b> a plan is SMART with manager support, has leading and lagging indicators and a review date, and escalates only when the policy and the facts justify it.</div>${doneBar('a5')}`}`);
    if(left)$('#x',p).onclick=()=>UI.close();else wireDone(p,'a5',()=>{})}
  const mk1=(t,g,f)=>({t,g,f});
  const WB=[
   {q:'The plan on the whiteboard reads: “Improve the close rate to 30% by working harder. We’ll review later.” Which SMART ingredients are missing? Select all that apply.',multi:true,o:[mk1('Specific: which behaviour will change?',1),mk1('Measurable: how will we know?',0,'“30%” is a measure, so this one is present.'),mk1('Time-bound: by when?',1),mk1('Manager support: what will the manager do?',1)],okT:'Right',why:'“Work harder” is not a specific behaviour, “later” is not a date, and the plan says nothing about what you, the manager, will do. The manager-support element is the one most often forgotten.'},
   {q:'Which rewrite of the first action is strongest?',o:[mk1('Pre-screen every clinic application against the financing partner’s criteria before submitting it (aim: 4 of 5 approved by the end of next month), with a 30-minute walkthrough from me this week and a check-in each Friday.',1),mk1('Try harder to get financing approvals over the next quarter.',0,'Still vague, with no support and no clear measure.'),mk1('Get the close rate back to 30% by next Friday.',0,'Measurable and dated, but unrealistic, with no specific behaviour and no support.')],okT:'Strongest',why:'It names a specific behaviour, a measure, a deadline and your support. That is what “SMART with manager support” means.'}];
  const CAL=[
   {q:'Pick the best LEADING indicator (something that can change quickly).',o:[mk1('A next step recorded for every proposal within two working days',1),mk1('Close rate',0,'That is a lagging indicator; it takes a quarter to move.'),mk1('Hours worked each week',0,'Activity is not the same as the behaviour that matters, and it invites presenteeism.')],why:'A leading indicator can change in days and predicts the outcome you care about.'},
   {q:'Pick the best LAGGING indicator (the outcome you are ultimately after).',o:[mk1('Close rate over the next full quarter',1),mk1('Revenue this week',0,'Too volatile and short to judge.'),mk1('Number of emails sent',0,'That is an activity count, not the outcome.')],why:'Lagging indicators are slower, so judge them over a fair period.'},
   {q:'How often should you check in?',o:[mk1('A short weekly check-in',1),mk1('Every day',0,'That is micromanagement and signals distrust.'),mk1('Only at the end of the quarter',0,'Too late to adjust or to give support.')],why:'Regular, short check-ins keep support visible and allow adjustment.'},
   {q:'When should you set the formal review?',o:[mk1('A fixed date about six weeks out',1),mk1('No fixed date; we’ll see how it goes',0,'Without a date nothing is reviewed.'),mk1('At the next annual review',0,'Far too late for a recovery plan.')],why:'A fixed, reasonable review date makes the plan fair and visible.'},
   {q:'Which escalation trigger is fairest to write into the plan?',o:[mk1('If there is no improvement at the review date despite the agreed support, consider involving HR and the formal route.',1),mk1('If the close rate is below target at the next check-in.',0,'One data point at one check-in is too hair-trigger.'),mk1('If one follow-up is missed.',0,'Disproportionate and punitive.')],why:'Escalate only when the gap persists despite fair support, never from frustration or one result.'}];
  const OPT=[mk1('Continue informal support and set a review date',0),mk1('Consult HR for guidance and support options',0),mk1('Follow the formal misconduct procedure (with HR)',0),mk1('Put them on a performance improvement plan now',0)];
  const FOLD={f1:{who:'Lee',case:'Close rate 17% → 22% → 26% (target 30%). Attends weekly coaching and follows the plan.',a:0,why:'Lee is improving and engaged. This is exactly what informal support is for. Escalating now would be premature and unfair.',fb:['','Not yet: nothing here requires HR involvement.','Nothing suggests misconduct.','A PIP is not the first response when someone is improving and engaged.']},
          f2:{who:'Ash',case:'Ash mentions a health condition that makes it hard to concentrate on follow-ups.',a:1,why:'Under the policy, an employee’s own health or disability means consulting HR. Do not ask for medical details; offer support and let HR guide the options.',fb:['Informal support is right, but the policy also requires HR here.','','This is not misconduct.','A PIP would be the wrong tool for a health matter.']},
          f3:{who:'Quinn',case:'The CRM shows records altered to hide stalled deals (suspected falsification).',a:2,why:'Suspected falsification is misconduct, not underperformance. It goes through the formal procedure with HR rather than informal coaching.',fb:['Coaching is the wrong tool for suspected misconduct.','HR should be involved, but this needs the formal misconduct route, not only guidance.','','A PIP is a performance tool; this is a conduct issue.']}};
  function folder(id){const f=FOLD[id];const qs=[{q:f.who+': '+f.case+' What is the proportionate next step?',o:OPT.map((o,k)=>({t:o.t,g:k===f.a?1:0,f:f.fb[k]})),okT:'Proportionate',why:f.why}];quiz(id,'Escalate or not?','Case folder: '+f.who,'',qs,'Escalation is proportionate to the facts: informal support for engaged improvement, HR for health, the formal route for misconduct.')}
  function open(id){if(id==='wb')quiz('wb','SMART repair','The whiteboard plan','A weak plan is on the board. Find what is missing, then choose a rewrite.',WB,'You can tell what makes a plan SMART with manager support, and what is missing when it is not.');
    else if(id==='cal')quiz('cal','Follow-up plan','The follow-up calendar','Design the monitoring, check-ins, review and escalation trigger for a recovery plan.',CAL,'Your follow-up plan has leading and lagging indicators, a rhythm of support, a review date and a fair trigger.');
    else folder(id)}
  function list(){const p=UI.open(`<h2>Accessible list view</h2><div class="list"><button class="btn ghost" data-id="wb">Whiteboard: repair a SMART plan ${ST.wb?'✓':''}</button><button class="btn ghost" data-id="cal">Calendar: follow-up plan ${ST.cal?'✓':''}</button><button class="btn ghost" data-id="f1">Case folder 1 ${ST.f1?'✓':''}</button><button class="btn ghost" data-id="f2">Case folder 2 ${ST.f2?'✓':''}</button><button class="btn ghost" data-id="f3">Case folder 3 ${ST.f3?'✓':''}</button></div><div class="bar"><button class="btn gold" id="x" autofocus>Close</button></div>`);p.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{UI.close();setTimeout(()=>open(b.dataset.id),30)});$('#x',p).onclick=()=>UI.close()}
  function help(){const p=UI.open(`<h2>How to play</h2><p>Visit all five stations: the <b>whiteboard</b> (repair a weak plan), the <b>calendar</b> (build the follow-up plan) and the three <b>case folders</b> on the table (escalate or not?). Retries are unlimited.</p><div class="bar"><button class="btn gold" id="x" autofocus>Got it</button></div>`);$('#x',p).onclick=()=>UI.close()}
  function intro(){const p=UI.open(`<span class="chip">Module 4 · Activity A5 · Learning outcomes 6 and 7</span><h2 class="px" style="font-size:17px;line-height:1.5;margin:10px 0">PLAN THE NEXT STEPS</h2><p>Great plans are specific, supported and followed up. In the planning room you will <b>repair a weak action plan</b>, <b>design follow-up</b> and decide, case by case, <b>when to escalate</b>.</p><div class="note small"><b>WASD / arrows</b> or tap to move, <b>E</b> to interact. Prefer not to walk? Use <b>List view</b>.</div><div class="bar"><button class="btn ghost" id="st2">Start with list view</button><button class="btn gold" id="st" autofocus>Start</button></div>`,{closable:false});$('#st',p).onclick=()=>UI.close();$('#st2',p).onclick=()=>{UI.close();setTimeout(list,30)}}
  return{cfg,hud,list,help,intro,state:{get:()=>ST,set:o=>Object.assign(ST,o),prog:()=>[doneN(),N]}};
}


Hub.toMenu();

</script></body></html>
