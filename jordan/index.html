aming the partner."}, {"id": "discount", "label": "Discounting to rescue deals", "min_trust": 0.58, "fact": "After financing rejections, Jordan has offered bigger discounts to rescue price-sensitive deals (6% to 13%). Jordan is a little embarrassed and knows it is not sustainable."}, {"id": "followup", "label": "Follow-up has slipped", "min_trust": 0.68, "fact": "Three proposals have no logged next step. Jordan has been catching up on admin and follow-up late, and some of it has simply not happened."}, {"id": "personal", "label": "Caring responsibilities", "min_trust": 0.78, "fact": "Since about the start of Q2 Jordan has been caring for a parent, which has cut into evening admin time. Jordan is private, does not want details discussed or HR 'making a thing of it', but would welcome some flexibility. Jordan is the carer, not the patient. Never give medical details."}], "case_summary": "Close rate (target 30%): Jordan 33/25/17 vs team 31/29/27. Financing approvals: Jordan 80/60/40% vs team 84/80/76%. Average discount on won deals: Jordan 6/9/13% vs team 7/7/8%. Demos and proposals have stayed near constant (about 18 demos, 12 proposals per quarter). Q3 CRM, 10 proposals not won: 3 declined by the financing partner, 4 lost to a competitor on price, 3 stalled with no recorded next step.", "files": [{"id": "score", "title": "Scorecard and team data", "html": "<p class='mut'>Quarters Q1 to Q3 this year. Target close rate: 30%.<\/p><table class='d'><tr><th><\/th><th>Q1<\/th><th>Q2<\/th><th>Q3<\/th><\/tr><tr class='sec'><td colspan='4'>Proposal close rate (%)<\/td><\/tr><tr class='hl'><td>Jordan<\/td><td>33<\/td><td>25<\/td><td>17<\/td><\/tr><tr><td>Team average<\/td><td>31<\/td><td>29<\/td><td>27<\/td><\/tr><tr class='sec'><td colspan='4'>Financing approvals (% of applications)<\/td><\/tr><tr class='hl'><td>Jordan<\/td><td>80<\/td><td>60<\/td><td>40<\/td><\/tr><tr><td>Team average<\/td><td>84<\/td><td>80<\/td><td>76<\/td><\/tr><tr class='sec'><td colspan='4'>Average discount on deals won (%)<\/td><\/tr><tr class='hl'><td>Jordan<\/td><td>6<\/td><td>9<\/td><td>13<\/td><\/tr><tr><td>Team average<\/td><td>7<\/td><td>7<\/td><td>8<\/td><\/tr><tr class='sec'><td colspan='4'>Activity (Jordan)<\/td><\/tr><tr><td>Demos delivered<\/td><td>18<\/td><td>17<\/td><td>18<\/td><\/tr><tr><td>Proposals sent<\/td><td>12<\/td><td>12<\/td><td>12<\/td><\/tr><tr><td>Financing applications approved / submitted<\/td><td>4 / 5<\/td><td>3 / 5<\/td><td>2 / 5<\/td><\/tr><\/table>"}, {"id": "crm", "title": "CRM records (Q3)", "html": "<p>Of the <b>10 proposals not won<\/b> in Q3:<\/p><ul><li>3 declined by the financing partner<\/li><li>4 lost to a competitor on price<\/li><li>3 stalled, <b>no recorded next step<\/b> (last activity three or more weeks ago)<\/li><\/ul><p class='mut'>Average list price about €110,000 per treatment-suite package.<\/p>"}, {"id": "review", "title": "Previous review (last year)", "html": "<p><b>Rating:<\/b> exceeded targets in all four quarters.<\/p><p>“Strong client relationships. Pre-screens financing applications carefully, which keeps approvals high. A reliable and generous colleague.”<\/p>"}, {"id": "email", "title": "Colleague email", "html": "<p class='mut'>From: a colleague on the regional team<\/p><p>“Just flagging: Jordan seems disengaged lately, and has missed the last two team huddles. Thought you should know.”<\/p><p class='mut small'>This is one person's impression, not a record.<\/p>"}, {"id": "policy", "title": "Policy excerpt (fictional)", "html": "<ul><li>Start with <b>informal and documented support<\/b>. A formal performance improvement plan (PIP) follows only after documented support and a review.<\/li><li><b>You can:<\/b> set actions, coach, schedule reviews, consult HR.<\/li><li><b>You cannot:<\/b> change targets or territories, promise leave or pay, or bypass policy.<\/li><li>Consult <b>HR<\/b> when an employee raises their <b>own health or disability<\/b>, or before any formal action. Flexible-working and leave requests go through HR.<\/li><\/ul>"}]}||{};
const API_DEFAULT="";

  const caus=S.revealed.length,mention=[/pre-?screen|financ/,/discount/,/next step|follow/,/flexib|\bhr\b|carer|caring|support/].filter(r=>r.test(all)).length;
  c.actions_match_causes={level:lv(caus>=2&&mention>=2?2:(caus>=1||mention>=1)?1:0),evidence:`You uncovered ${caus} of ${(CFG.reveals||[]).length} causes; your plan touches ${mention} relevant area(s).`,next_step:'Match each action to a cause Jordan actually confirmed, and avoid solving causes you did not uncover.'};
  const sr=[/\bi (will|'ll)|my support|walkthrough|coach|pair|shadow/,/check-?in|weekly/,/review|\d+ ?weeks?|by (the )?(end|friday|monday|\d)/,/leading|lagging|indicator|next step logged|close rate/].filter(r=>r.test(all)).length;
  c.support_and_review={level:lv(sr>=4?2:sr>=2?1:0),evidence:`${sr} of 4 elements found (manager support, check-ins, review date, indicators).`,next_step:'Name your own support, a weekly check-in, a fixed review date and one leading plus one lagging indicator.'};
  const viol=ml(['promise_beyond_authority','threat_formal'])+(/(promise|guarantee).*(leave|pay|target)|lower (your )?target|\bpip\b.*(now|immediately|straight)/i.test(all)?1:0),hr=/\bhr\b/.test(all)&&/(if|unless|no improvement|persist)/.test(all);
  c.policy_boundaries={level:lv(viol?0:hr?2:1),evidence:viol?'A promise beyond your authority or an early formal threat appeared.':hr?'You kept within authority and framed HR as a proportionate trigger.':'You stayed within authority; the HR trigger was not clearly framed.',next_step:'Escalate only if there is no improvement despite agreed support; use HR for health or leave questions.'};
  const mc=[];S.ex.forEach((e,i)=>{if(e.cue){const nx=S.ex[i+1];if(!nx||!nx.moves.some(m=>['empathy_acknowledge','curious_followup','open_question','invites_voice'].includes(m)))mc.push(`Turn ${i+1}: ${e.cue}`)}});
  return{criteria:CRIT.map(([id])=>({id,...c[id]})),strengths:S.ex.flatMap(e=>e.moves.filter(m=>CFG.moves[m]>0)).filter((m,i,a)=>a.indexOf(m)===i).slice(0,4).map(m=>CFG.move_labels[m]),missed_cues:mc,overall:'Feedback generated by simple rules in demo mode. The live AI debrief gives richer, quoted feedback.'}}
async function doDebrief(){const p=panel('<h2>Preparing your debrief…</h2><p class="mut">Reviewing your conversation.</p>',{sticky:true});let d=null;
  if(LIVE){try{d=await postJSON('/api/debrief',{turns:S.ex,wrap:S.wrap,revealed:S.revealed},45000)}catch(e){d=null}}
  const loc=localDebrief();const live=!!(d&&d.criteria);if(!live)d=loc;
  const missed=(d.missed_cues&&d.missed_cues.length?d.missed_cues:loc.missed_cues);
  S.phase='debrief';clearSaved();renderDebrief(d,missed,live);submitRecord(d,live)}
async function submitRecord(d,live){const n=document.getElementById('subst');const set=t=>{if(n)n.textContent=t};
  if(!API||!CODE_RX.test(CODE)){set('Not sent to a facilitator (no server or learner code). Use Download to keep a copy.');return}
  const rec={when:new Date().toISOString(),mode:LIVE?'live':'demo',revealed:S.revealed,turns:S.ex,wrap:S.wrap,ai_debrief:live?d:null,rule_debrief:live?null:d};
  for(let a=0;a<2;a++){try{await postJSON('/api/submit',{code:CODE,kind:'jordan',payload:rec},25000);set('Sent to your facilitator for review ✓ (code '+CODE+').');return}catch(e){if(a===1)set('Could not send to your facilitator ('+(e.message||'network')+'). Please use Download and hand in the file.')}}}
function spark(){const h=[CFG.start_trust||.4].concat(S.ex.map(e=>e.trust)),W=560,H=110,x=i=>12+i*(W-24)/Math.max(1,h.length-1),y=v=>H-10-v*(H-20);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px" role="img" aria-label="Jordan's trust across the conversation: ${h.map(v=>Math.round(v*100)).join(', ')} percent"><rect width="${W}" height="${H}" fill="#0f1d33" rx="8"/><line x1="12" x2="${W-12}" y1="${y(.5)}" y2="${y(.5)}" stroke="#2a4468" stroke-dasharray="4 4"/><polyline fill="none" stroke="#f2c14e" stroke-width="3" points="${h.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${h.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#5fd0e0"/>`).join('')}</svg>`}
function renderDebrief(d,missed,live){const lc=l=>/Clearly/.test(l)?'c':/Partly/.test(l)?'p':'n';
  const rows=S.ex.map((e,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${esc(e.user.slice(0,110))}${e.user.length>110?'…':''}</td><td style="text-align:left">${e.moves.map(m=>`<span class="pill ${CFG.moves[m]>0?'p':'n'}">${esc(CFG.move_labels[m]||m)}</span>`).join('')||'<span class="mut">–</span>'}</td><td>${e.emotion}</td></tr>`).join('');
  const found=(CFG.reveals||[]).map(r=>`<li>${S.revealed.includes(r.id)?'✓':'✗'} ${esc(r.label)}</li>`).join('');
  const p=panel(`<span class="chip">Debrief · ${live?'AI feedback':'rule-based feedback'}</span><h2>Your conversation with Jordan</h2><p>${esc(d.overall||'')}</p>
  <div class="note small"><b>This feedback is provisional.</b> Your facilitator reviews the transcript and confirms or changes each level. <span id="subst" aria-live="polite">Sending your record…</span></div>
  <h3>Jordan's trust over the conversation</h3>${spark()}<p class="small mut">Trust rises when you are specific, curious and fair, and falls with blame, leading questions, pressure or promises you cannot keep.</p>
  <h3>Criteria (no numeric grade: scoring bands are set later)</h3>${(d.criteria||[]).map(c=>{const nm=(CRIT.find(x=>x[0]===c.id)||[0,c.id])[1];return `<div class="crit"><b>${esc(nm)}</b> · <span class="lvl ${lc(c.level)}">${esc(c.level)}</span><div class="small">${esc(c.evidence||'')}</div><div class="small mut">Next time: ${esc(c.next_step||'')}</div></div>`}).join('')}
  ${(d.strengths||[]).length?`<h3>What worked</h3><ul>${d.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}
  <h3>Cues Jordan gave</h3>${missed.length?`<ul>${missed.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:'<p class="small">You picked up the cues Jordan offered (or none were offered).</p>'}
  <h3>What was behind the decline</h3><ul style="list-style:none;padding-left:0">${found}</ul><p class="small mut">Real cause: pre-screening did not adapt to the financing partner's new criteria; discounts rose to rescue deals; follow-up slipped; Jordan has been caring for a parent. A proportionate response is support, not an automatic PIP.</p>
  <h3>Your path, turn by turn</h3><table class="d"><tr><th>#</th><th>You said</th><th>Moves</th><th>Jordan</th></tr>${rows}</table>
  <div class="bar"><button class="btn" id="dl">Download transcript + debrief</button><button class="btn ghost" id="re">Try again</button><button class="btn gold" id="x">Close</button></div>`,{sticky:true});
  p.querySelector('#x').onclick=closeP;p.querySelector('#re').onclick=()=>{closeP();briefPanel()};p.querySelector('#dl').onclick=()=>download(d,missed)}
function download(d,missed){const t=['MDOE407 final simulation: transcript and debrief','',...S.ex.map((e,i)=>`[${i+1}] You: ${e.user}\n    Jordan (${e.emotion}): ${e.reply}\n    Moves: ${e.moves.join(', ')||'none'}`),'','SUMMARY BACK:',S.wrap.summary,'','SMART ACTIONS:',S.wrap.actions,'','FOLLOW-UP PLAN:',S.wrap.followup,'','CRITERIA:',...(d.criteria||[]).map(c=>`- ${c.id}: ${c.level}. ${c.evidence} Next: ${c.next_step}`),'','MISSED CUES:',...(missed.length?missed:['none'])].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='jordan_simulation_debrief.txt';a.click()}
